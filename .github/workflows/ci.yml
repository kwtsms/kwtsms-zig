name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Test (Zig 0.17.1)
    runs-on: ubuntu-latest
    # 2026-11-15 16:53 +03: single Zig 0.17.1 job, the 0.13 matrix and the continue-on-error probe removed, zig-017-port

    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.17.1'

      - name: Build
        run: zig build

      - name: Check formatting
        run: zig fmt --check src/ examples/

      - name: Run unit tests
        # 2026-11-05 08:52 +03: phone tests read KWTSMS_TEST_NUMBER (skipped when unset), int-testnumber.
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: zig build test
