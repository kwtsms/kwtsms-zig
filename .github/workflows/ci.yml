name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Test (Zig ${{ matrix.zig-version }})
    runs-on: ubuntu-latest
    # 2026-11-15 10:20 +03: Zig 0.17.1 probe (weekly upstream check, job 13); allowed to fail until the port is done
    continue-on-error: ${{ matrix.zig-version != '0.13.0' }}
    strategy:
      fail-fast: false
      matrix:
        zig-version: ['0.13.0', '0.17.1']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Build
        run: zig build

      - name: Check formatting
        run: zig fmt --check src/ examples/

      - name: Run unit tests
        # 2026-11-05 08:52 +03: phone tests read KWTSMS_TEST_NUMBER (skipped when unset), int-testnumber.
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: zig build test
