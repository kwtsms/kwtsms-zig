name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          # 2026-11-15 16:53 +03: Zig 0.17.1 only, zig-017-port
          version: '0.17.1'

      - name: Build
        run: zig build

      - name: Run tests
        # 2026-11-05 08:52 +03: phone tests read KWTSMS_TEST_NUMBER (skipped when unset), int-testnumber.
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: zig build test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
